# Serving recipes for the run planner.
#
# A recipe is a WHOLE serving configuration - weights, image and every vLLM flag
# - not a template with blanks. The tuning is interdependent: DFlash2 needs a
# target with an unquantised lm_head, GDN layers only work under one mamba cache
# mode, and FP8 KV needs calibration scales that some exports ship and others do
# not. Offering these as independent dropdowns would mostly produce combinations
# that fail several minutes into a weight load, so a recipe is picked whole.
#
# Four of the recipes below are ports of serve-qwen38-27b-vllm-tuned.sh,
# serve-qwen36-35b-a3b-dflash.sh, serve-diffusiongemma-26b-a4b.sh and
# run-comfyui-h3-spark.sh. Each carries the reasoning from the script it came
# from, and says which of that script's knobs the planner now decides instead.
# The last two, Qwen3-ASR and GLM-ASR-Nano, have no script behind them and
# derive their figures from each model's own config and from vLLM's source.
#
# Edit this file and restart the server. Every recipe is validated on load: a
# bad one is reported by name and the whole catalogue is refused rather than
# half-applied, so the planner never offers something it cannot run.
#
# ---------------------------------------------------------------------------
# MEMORY, AND WHY --gpu-memory-utilization IS NOT SET HERE
#
# vLLM does not allocate what the model needs. It claims
# gpu-memory-utilization x TOTAL memory as one block at startup, loads the
# weights into it, and gives the entire remainder to the KV cache - which is
# never resized afterwards. So the fraction is not a memory requirement, it is a
# policy: "how much of this machine is vLLM's".
#
# The planner therefore computes the SMALLEST fraction that fits, from the
# context length and concurrency actually being asked for, and passes that. A
# recipe does not set --gpu-memory-utilization at all; the UI can raise it above
# the minimum when you want a deeper prefix cache, and refuses to lower it below
# the point where the KV cache no longer fits.
#
# The measured breakdown this arithmetic is built on, read out of a real
# vLLM 0.28.0 startup on a DGX Spark running the nvfp4-dflash2 recipe:
#
#   Desired GPU memory utilization is (0.92, 111.95 GiB)
#     28.16 GiB  weights + non-torch   (model load alone: 25.43 GiB)
#      3.07 GiB  peak activation
#      1.81 GiB  CUDAGraph memory
#     80.73 GiB  KV cache -> 1,933,714 tokens, 7.38x concurrency at 262,144
#
# That gives 80.73 GiB / 1,933,714 = 44,827 bytes per token, and a fixed
# overhead of 2.73 + 3.07 + 1.81 = 7.61 GiB (8.2 GB) beyond the weights.
#
# Two things about that per-token figure. It is a property of the ARCHITECTURE
# and the KV dtype, not of the weight quantisation, so any other fp8-KV recipe
# on this model shares it. And it is large because --mamba-cache-mode align forces
# the attention page to match the mamba page: vLLM logged "Setting attention
# block size to 880 tokens", so even a short request occupies a 880-token block
# and the hybrid layer padding wastes up to 25% on top.
#
# ---------------------------------------------------------------------------
# FIELDS
#
#   id            lowercase kebab-case, unique, stable (it is the API key)
#   name/summary  what the panel shows
#   model         repo: the Hub id served
#                 sizeGB: on-disk size in decimal GB
#                 measured: true if sizeGB was read off a real cache, false if
#                   it was derived from the parameter count (the UI labels it)
#   draft         optional speculative drafter, same shape as model
#   servedName    optional; defaults to model.repo, like the script's SERVED_NAME
#   image.ref     the image to run
#   image.build   optional; when present the run BUILDS this tag instead of
#                 pulling it - `from:` plus a list of `run:` steps
#   container     docker container name; the run replaces its own, never another
#   port          host port published to 0.0.0.0
#   overheadGB    everything that is neither weights nor KV cache: non-torch
#                 allocations, peak activation and CUDA graph capture. Roughly
#                 constant per model at a given --max-num-batched-tokens.
#   kvBytesPerToken  KV cache cost of one token, used to size the pool from the
#                 context length and concurrency the user picks
#   kvMeasured    true if that rate came off a real startup log, false if it is
#                 an estimate (the UI labels it)
#   args          vLLM flags as a map. A bare flag is `true`; everything else
#                 becomes its value. The model id is passed positionally from
#                 model.repo, so it is not repeated here.
#                 --max-num-seqs here is a DEFAULT: the panel starts on it and
#                 the user can raise or lower it per run, up to 64.
#                 --max-model-len is a CEILING as well as the starting value.
#                 The picker offers no context longer than it, and a longer one
#                 asked for over the API is clamped down to it rather than
#                 refused. So declare the model's NATIVE WINDOW here, never a
#                 memory budget: the fraction is computed from whatever context
#                 is actually picked, so a short value buys nothing and only
#                 puts the longer contexts permanently out of reach.
#                 Do not set --gpu-memory-utilization; it is computed.
#   notes         shown under the recipe in the panel
#
# Values containing { } " : must be quoted, or YAML reads them as structure -
# every --speculative-config below is quoted for exactly that reason.
# ---------------------------------------------------------------------------
#
# WEIGHT SIZES. Both exports the recipe below uses were cached on the Spark it
# was built against, and are measured - from `hf cache ls` on 2026-08-30:
#
#   RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead   23.8 GB
#   incoai/Qwen3.8-27B-DFlash2                3.8 GB
#
# vLLM logged 25.43 GiB to load the pair, against 25.70 GiB of files, so on-disk
# size is a good proxy for what the weights cost in memory. A recipe whose size
# is derived from a parameter count instead should set `measured: false`, and
# the panel will label the figure as an estimate.

- id: qwen38-27b-nvfp4-dflash2
  name: Qwen3.8-27B · NVFP4 + DFlash2
  summary: >-
    Lowest single-stream latency. Measured on a Spark at 45.6 tok/s on code with
    an acceptance length of 4.70.
  model:
    repo: RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead
    sizeGB: 23.8
    measured: true
  draft:
    repo: incoai/Qwen3.8-27B-DFlash2
    sizeGB: 3.8
    measured: true
  image:
    ref: vllm/vllm-openai:v0.28.0-aarch64
  container: spark-run-qwen38-nvfp4-dflash2
  port: 8000
  # Measured: 2.73 non-torch + 3.07 activation + 1.81 CUDA graphs = 7.61 GiB.
  overheadGB: 8.2
  # Measured: 80.73 GiB of pool over 1,933,714 tokens, fp8 KV with align mode.
  kvBytesPerToken: 44827
  kvMeasured: true
  args:
    --tensor-parallel-size: 1
    --distributed-executor-backend: mp
    --trust-remote-code: true
    --enable-prefix-caching: true
    --enable-chunked-prefill: true
    --attention-backend: FLASHINFER
    --mamba-ssm-cache-dtype: bfloat16
    --mamba-cache-mode: align
    --max-model-len: 262144
    --max-num-seqs: 1
    --max-num-batched-tokens: 8192
    --kv-cache-dtype: fp8
    # k caps at 7: the drafter's dflash_config.block_size is 8.
    --speculative-config: '{"method":"dflash","model":"incoai/Qwen3.8-27B-DFlash2","num_speculative_tokens":7}'
    --enable-auto-tool-choice: true
    --tool-call-parser: qwen3_coder
    --reasoning-parser: qwen3
  notes:
    - >-
      Wins single-stream only. DFlash2 crosses over at concurrency 2, above
      which 4-bit + MTP is faster.
    - >-
      Needs an unquantised lm_head. This export keeps a dense BF16 head, which
      is why it works where other 4-bit exports are refused.
    - >-
      Check the startup log says "DFlash2DraftModel": a DFlash2 checkpoint on a
      runtime older than 0.27.1 silently drafts as DFlash1.

# ---------------------------------------------------------------------------
# Ported from serve-qwen36-35b-a3b-dflash.sh.
#
# EVERY FIGURE BELOW IS TAKEN FROM THE NODE, NOT FROM THE SCRIPT. The script's
# own sizing prose turned out to be badly wrong about this model, so weights
# come from `du` over the cache blobs and the rest from its config.json, read
# on nv-spark-01 on 2026-08-31 at revision e94a930.
#
#   text_config: 40 layers, of which layer_types says only 10 are
#   full_attention (full_attention_interval 4) and 30 are linear_attention;
#   num_key_value_heads 2, head_dim 256, max_position_embeddings 262144.
#
# That architecture is the whole story for memory: only the 10 full-attention
# layers hold a per-token KV cache, and the 30 linear-attention layers keep a
# fixed-size recurrent state per SEQUENCE that does not grow with context.
#
# WHAT DID NOT CARRY OVER from the script, and why:
#
#   GPU_MEM_UTIL=0.45   Computed, not declared - see the header. The script
#                       picked 0.45 by hand to leave room for a second model.
#                       With the real KV rate below the same settings price far
#                       lower than that, so the fraction it hand-tuned was
#                       sized against a cost this model does not have.
#   max-model-len=32K   The model's native window is 262144. The script's 32K
#                       was a memory budget, not a limit - see the flag below.
#   SHM_SIZE=16g        The launcher gives every recipe --shm-size=32g. On
#                       unified memory this tmpfs is a lazy cap and not a
#                       reservation, which is the script's own reasoning for
#                       treating 16g and --ipc=host as interchangeable, so the
#                       larger cap costs nothing. `ipcHost: true` would switch
#                       to --ipc=host if that is ever wanted.
#   SKIP_PRESTAGE       The download phase is the pre-stage, and it is already
#                       idempotent: `hf download` skips what is cached, so a
#                       re-run of a cached recipe walks straight past it.
#   The JIT warm-up     The script fires a 3-token request after readiness so
#                       the first real one does not eat cold-start codegen. The
#                       run stops at the readiness probe, so the FIRST
#                       completion through this recipe still pays that cost.

- id: qwen36-35b-a3b-nvfp4-dflash
  name: Qwen3.6-35B-A3B · NVFP4 + DFlash
  summary: >-
    Agentic serving with a 0.5B block drafter, on the patched DGX Spark vLLM
    build. A hybrid model - 30 of its 40 layers are linear attention - so its
    KV cache is small and full 256K context is cheap.
  model:
    # Measured: du over the cache blobs on nv-spark-01, 2026-08-31.
    repo: RedHatAI/Qwen3.6-35B-A3B-NVFP4
    sizeGB: 25.1
    measured: true
  draft:
    # Measured the same way. 6 layers, head_dim 128 - a small drafter, and its
    # weights and KV both live INSIDE the fraction rather than beside it.
    repo: z-lab/Qwen3.6-35B-A3B-DFlash
    sizeGB: 0.8
    measured: true
  image:
    # Untagged on purpose, as in the script: this is the patched DGX Spark
    # nightly and there is no version to pin. `latest` therefore moves under
    # you, and the image phase re-pulls it.
    #
    # The script prepends `vllm serve` because this image sets no ENTRYPOINT.
    # That does NOT carry over: the launcher pins --entrypoint vllm and passes
    # `serve` itself, which is what makes this image and vllm/vllm-openai take
    # identical argv. Re-adding it here would produce `vllm serve vllm serve`.
    ref: ghcr.io/spark-arena/dgx-vllm-eugr-nightly
  container: spark-run-qwen36-a3b-dflash
  port: 8000
  # The one figure here still NOT taken from the node. Starting from the real
  # breakdown of the 27B recipe - 2.73 non-torch + 3.07 activation + 1.81 CUDA
  # graphs = 7.61 GiB - and doubling only the activation term, because this
  # recipe runs --max-num-batched-tokens 16384 against that recipe's 8192 and
  # the prefill working set is what scales with it: 2.73 + 6.14 + 1.81 = 10.7
  # GiB, so 11 GB. Rounded up deliberately: overstating it only makes vLLM
  # claim slightly more than it needs, while understating it leaves a pool too
  # small to hold max-model-len and the server exits at startup. Now that the
  # KV cache is small, this term dominates the plan - so it is the figure most
  # worth replacing with a real startup log.
  overheadGB: 11
  # DERIVED FROM THE ARCHITECTURE, and cross-checked against the one measured
  # KV rate in this file. Only the 10 full-attention layers cost per token:
  #
  #   10 layers x 2 (K and V) x 2 kv heads x 256 head_dim x 1 byte (fp8)
  #     = 10,240 bytes per token, architecturally
  #
  # vLLM allocates in blocks, so the real rate is higher. The 27B recipe gives
  # the correction factor, because its measured rate and its config are both
  # known: 16 full-attn layers x 2 x 4 x 256 = 32,768 bytes architecturally
  # against 44,827 measured, or 1.37x for block padding. Applying the same
  # factor here gives 10,240 x 1.37 = 14,008.
  #
  # DO NOT restore the earlier 632,000 figure. It came from reading the
  # script's "fp8 KV at GMU 0.85 gave a ~125K-token pool" as a real
  # measurement, and it is 45x too high - impossible for an architecture with
  # 2 KV heads across 10 attention layers, whatever the padding. That single
  # bad number is what made 32K look expensive and 256K look unreachable.
  kvBytesPerToken: 14008
  kvMeasured: false
  args:
    --trust-remote-code: true
    --enable-prefix-caching: true
    --enable-chunked-prefill: true
    # The model's native window, straight out of config.json
    # (max_position_embeddings 262144) - NOT the script's 32768.
    #
    # The script's 32K was a consequence of pinning GPU_MEM_UTIL=0.45 to share
    # the box, sized against a KV cost this model does not have. Here the
    # fraction is computed FROM the context, and this field is a CEILING as
    # well as the starting value, so a memory budget written here would put the
    # model's real reach permanently out of the picker's range. Declare the
    # window; let the planner price whatever context is chosen.
    --max-model-len: 262144
    # 2 streams, the script's own choice, and this part of its reasoning does
    # survive the port: it stays under the Spark's bandwidth ceiling, above
    # which decode streams spike TTFT. Unlike the context above this is only a
    # starting value, not a cap - the panel offers up to 64.
    --max-num-seqs: 2
    --max-num-batched-tokens: 16384
    # fp8 roughly halves the bytes per token. This checkpoint ships no KV
    # scaling factors, so they are computed during prefill rather than falling
    # back to scale=1.0, which risks overflow.
    --kv-cache-dtype: fp8
    --calculate-kv-scales: true
    # GPUDirect Storage accelerated weight loading, for a faster cold start.
    --load-format: fastsafetensors
    # k=15 is z-lab's recommended block depth for this drafter.
    --speculative-config: '{"method":"dflash","model":"z-lab/Qwen3.6-35B-A3B-DFlash","num_speculative_tokens":15}'
    --enable-auto-tool-choice: true
    --tool-call-parser: qwen3_coder
    --reasoning-parser: qwen3
  notes:
    - >-
      A hybrid model: only 10 of its 40 layers are full attention, and those
      use 2 KV heads. So its KV cache is roughly a third of the 27B recipe's
      per token, and full 256K context over 2 streams costs about 7 GB.
    - >-
      Weights are measured off the node's cache. The KV rate is derived from
      config.json and calibrated against the 27B's measured rate; the overhead
      figure is the one estimate left. Read all three off the first startup log
      and set kvMeasured: true.
    - >-
      The drafter and its KV live INSIDE the memory fraction, not beside it, so
      they compete with the target's KV cache rather than adding to the total.
    - >-
      The script pinned 0.45 so two models could share the box. These settings
      ask for far less than that at full context, so the sharing it was tuned
      for comes free rather than costing context.
    - >-
      No tag on the image - it is a nightly, so what runs today is not what ran
      last week. Pin a digest here if a run needs to be reproducible.
    - >-
      Readiness stops at the endpoint answering. The first completion still
      pays the JIT cold start the script's warm-up request absorbed.

# ---------------------------------------------------------------------------
# Ported from serve-diffusiongemma-26b-a4b.sh.
#
# A BLOCK DIFFUSION model, not an autoregressive one: it denoises whole blocks
# of tokens bidirectionally instead of emitting them left to right. That is the
# reason for the two unusual flags below - the V2 model runner, which is the
# only one with diffusion decoding, and TRITON_ATTN, which is the only
# attention backend that does not assume causal paged decode.
#
# EVERY FIGURE HERE IS MEASURED, off a real vLLM startup on nv-spark-01 kept at
# ~/Workspace/diffusiongemma-26b-a4b-nvfp4-dgx-spark/logs. That run served
# nvidia/diffusiongemma-26B-A4B-it-NVFP4 - NVIDIA's export of this same model -
# on this recipe's image, at --gpu-memory-utilization 0.35, --max-model-len
# 262144, --max-num-seqs 4, --max-num-batched-tokens 32768:
#
#   Model loading took                                    18.16 GiB
#   Available KV cache memory                             17.61 GiB
#   GPU KV cache size                                    806,319 tokens
#   Maximum concurrency for 262,144 tokens per request:     3.08x
#
# 0.35 of the Spark's 121.68 GiB is 42.59 GiB, so everything that is neither
# weights nor KV is 42.59 - 18.16 - 17.61 = 6.82 GiB, at 32768 batched tokens.
# And the pool gives 17.61 / 806,319 = 23,451 bytes per KV token - which is
# exactly the rate vLLM's own "maximum concurrency" line divides by, so it is
# the right number for a planner that answers the same question.
#
# THE SCRIPT'S MEMORY PROSE IS 10x TOO EXPENSIVE, and this is the whole story
# of the port. It states "full-precision KV runs ~240 KiB/token here" and sizes
# everything from that: 64K context, 2 sequences, half the box. Two things are
# wrong with it, both readable in config.json on the node (revision 8484b309):
#
#   - Of 30 layers, layer_types says 25 are sliding_attention with a 1024-token
#     window and only 5 are full_attention. A windowed layer keeps a fixed
#     amount of KV per sequence; it does not grow with context. Pricing all 30
#     as growing attention is where most of the 240 KiB comes from.
#   - The KV is not full precision. The export carries a modelopt fp4
#     quantisation config, and vLLM resolves --kv-cache-dtype auto to fp8_e4m3
#     off the back of it - the log says so on the way up. That halves it again.
#
# Architecturally the part that grows with context is the 5 full-attention
# layers: 5 x 2 (K and V) x 2 kv heads x 512 global_head_dim x 1 byte = 10,240
# bytes per token. The measured 23,451 is 2.3x that, the difference being the
# windowed layers' fixed state and the hybrid allocator's page padding. That
# 2.3x is NOT derived here - it is measured, and it is why the figure below
# comes from the log rather than from the arithmetic.
#
# WHAT DID NOT CARRY OVER from the script, and why:
#
#   GPU_MEM_UTIL=0.45   Computed, not declared - see the header. The script
#                       halved the box by hand so a second vLLM could share it;
#                       at the real KV rate these settings ask for far less
#                       than half, so that sharing comes free.
#   MAX_MODEL_LEN=65536 The native window is 262144, and the log ran at it. The
#                       script's 64K was a memory budget derived from the KV
#                       rate above, and this field is a CEILING as well as a
#                       starting value, so writing 64K here would put the
#                       model's real reach out of the picker's range for good.
#   PORT=8001           8001 existed only to dodge the gemma4 launcher on 8000.
#                       One run at a time per node, so 8000 is free.
#   --hf-overrides      The script overrides the diffusion sampler to
#                       entropy_bound at 0.1. generation_config.json on the
#                       node ALREADY says exactly that
#                       (EntropyBoundSamplerConfig, entropy_bound 0.1), and
#                       those keys live in generation_config, not in the HF
#                       config that --hf-overrides patches. Dropped as both
#                       redundant and aimed at the wrong file.
#   API_KEY/SKIP_...    The launcher supplies the key - the vault's
#                       VLLM_API_KEY, or one it generates for the run; the
#                       download phase is the pre-stage and is already idempotent.
#   The JIT warm-up     The script fires a 3-token request after readiness. The
#                       run stops at the readiness probe, so the FIRST
#                       completion through this recipe still pays that cost.
#
# One flag is here that the script does not have:
# --override-generation-config. generation_config.json sets max_new_tokens 256,
# which silently truncates every completion at 256 tokens; the launcher that
# produced the log above passes this to lift it, and so does the recipe.

- id: diffusiongemma-26b-a4b-nvfp4
  name: DiffusionGemma-26B-A4B · NVFP4
  summary: >-
    A block diffusion model - it denoises blocks of tokens rather than emitting
    them one at a time. Agentic serving at the full 256K window; 25 of its 30
    layers are windowed attention, so its KV cache is cheap.
  model:
    # Measured: du over the cache blobs on nv-spark-01, 2026-08-31.
    repo: RedHatAI/diffusiongemma-26B-A4B-it-NVFP4
    sizeGB: 18.1
    measured: true
  image:
    # The image the measured run used. Tagged but not versioned - `gemma` is a
    # moving branch build (it reported vLLM 0.22.1rc1.dev357+g74b5964f0), so
    # pin a digest here if a run has to be reproducible.
    ref: vllm/vllm-openai:gemma
  container: spark-run-diffusiongemma
  port: 8000
  # Diffusion decoding lives only in the V2 model runner; the V1 runner rejects
  # the architecture outright.
  env:
    VLLM_USE_V2_MODEL_RUNNER: 1
  # Measured: 42.59 GiB claimed - 18.16 weights - 17.61 KV = 6.82 GiB, at the
  # --max-num-batched-tokens below. Rounded up: overstating it makes vLLM claim
  # slightly more than it needs, while understating it leaves a pool too small
  # for max-model-len and the server exits during startup.
  overheadGB: 7.5
  # Measured: 17.61 GiB of pool over 806,319 tokens, fp8 KV. See the header for
  # why this is a tenth of what the script's prose claims.
  kvBytesPerToken: 23451
  kvMeasured: true
  args:
    --trust-remote-code: true
    --enable-prefix-caching: true
    --enable-chunked-prefill: true
    # Diffusion decode denoises a block bidirectionally rather than extending a
    # sequence token by token, which rules out the causal paged-attention
    # backends. TRITON_ATTN supports it - and Gemma-family heterogeneous head
    # dims force it on GB10 anyway.
    --attention-backend: TRITON_ATTN
    # config.json: max_position_embeddings 262144, and the log ran at it.
    --max-model-len: 262144
    # The measured run's concurrency. Only a starting value - the panel offers
    # up to 64 - unlike the context above, which is also the ceiling.
    --max-num-seqs: 4
    # The overhead figure above was measured at this value. Peak activation is
    # what scales with it, so changing it here without re-reading the log makes
    # that figure wrong in whichever direction it moved.
    --max-num-batched-tokens: 32768
    # Written out rather than left to `auto`. auto resolves to fp8_e4m3 here -
    # the log says so - off the checkpoint's modelopt fp4 config, so this
    # changes nothing except tying the measured KV rate to a flag instead of to
    # an inference vLLM makes about the export.
    --kv-cache-dtype: fp8
    # generation_config.json caps max_new_tokens at 256. Without this every
    # completion stops there, whatever the client asked for.
    --override-generation-config: '{"max_new_tokens": null}'
    # Thinking on for every chat request unless the client overrides it. The
    # model's bundled chat template is used as-is, with no --chat-template, so
    # that this applies and per-request overrides work.
    --default-chat-template-kwargs: '{"enable_thinking": true}'
    --enable-auto-tool-choice: true
    --tool-call-parser: gemma4
    --reasoning-parser: gemma4
  notes:
    - >-
      Diffusion decoding needs the V2 model runner and TRITON_ATTN; both are
      set here and neither is optional. A run that ends with the architecture
      being rejected has lost one of them.
    - >-
      Cheap context. Only 5 of 30 layers are full attention and the rest are
      windowed at 1024 tokens, so 256K over 4 streams costs about 25 GB of KV -
      a tenth of what the reference script's sizing prose implies.
    - >-
      The checkpoint ships no KV scaling factors, so vLLM falls back to
      scale 1.0 and says so on the way up. It served fine that way in the
      measured run. If fp8 accuracy looks wrong, --calculate-kv-scales computes
      them during prefill instead - untested on this model.
    - >-
      The tool and reasoning parsers are Gemma 4's. This model shares Gemma 4's
      26B-A4B architecture and reasoning format, and the measured run accepted
      them, but no vLLM parser name is documented for DiffusionGemma - so send
      a request with a tool schema and confirm it comes back as tool_calls.
    - >-
      It ignores repetition, frequency and presence penalties. vLLM logs that
      it is dropping them per request rather than failing, so a client that
      relies on them will get output that quietly disagrees with its settings.
    - >-
      The measured startup was NVIDIA's export of this model; the recipe serves
      Red Hat's, which is the one the reference script names. Same architecture
      and same quantisation, 18.1 GB against 18.9 GB on disk.
    - >-
      Readiness stops at the endpoint answering. The first completion still
      pays the JIT cold start the script's warm-up request absorbed.

# ---------------------------------------------------------------------------
# A `service` recipe: a container that wants a GPU, not a vLLM server. It brings
# its own entrypoint, keeps its weights in directories of its own, and has no KV
# cache to size - so it declares what it needs as one figure and the panel shows
# no tuning sliders for it.
#
# Ported from run-comfyui-h3-spark.sh.
#
# LICENCE. MiniMax H3 ships under the MiniMax H3 Community License, whose
# "Excluded Territories" are the EU, the UK, South Korea and the United States.
# The licence does not grant use rights there. Read it before running this for
# anything real; the planner will happily start it wherever the node is.

- id: comfyui-minimax-h3
  runtime: service
  name: ComfyUI · MiniMax H3
  summary: >-
    Text-, image- and reference-to-video with native stereo audio, up to 2K/15s.
    ComfyUI's own web UI rather than an OpenAI-compatible endpoint.
  image:
    # Built out of band from the comfyui-minimax-h3 repo's Dockerfile:
    #   docker build -t comfyui-minimax-h3:local .
    # That Dockerfile is 85 lines of ARG/ENV/RUN and clones ComfyUI itself, which
    # image.build (a base plus RUN steps) cannot express - so the recipe expects
    # the tag to exist and the panel reports it missing if it does not.
    ref: comfyui-minimax-h3:local
  container: comfyui-h3
  port: 8188
  containerPort: 8188
  # Shared memory: ComfyUI's launcher shares the host IPC namespace rather than
  # asking for a --shm-size, which gets past docker's 64MB default the same way.
  ipcHost: true
  # MEASURED on a GB10, 2026-08-31, running a 2K/15s generation:
  #
  #   cgroup peak                  58 GiB   staged host-side copies
  #   nvidia-smi, the same pid     39 GiB   device-resident weights
  #   -> about 104 GB in total, against a 121.7 GiB pool
  #
  # Two things make this far larger than the 66.9 GB of weight files, and both
  # are specific to unified memory:
  #
  # 1. ComfyUI's "offload device: cpu" frees nothing here. Its memory manager
  #    assumes discrete VRAM, where moving the text encoder to system RAM buys
  #    back VRAM for the diffusion model. On GB10 both are the same LPDDR5X, so
  #    the peak is the SUM of the components, not the largest of them:
  #    25.9 GB text encoder + 32.4 GB diffusion + VAEs, all resident at once.
  # 2. "Dynamic VRAM loading" keeps a staged host copy AND a device copy of the
  #    same weights - on one physical pool that is the same bytes counted twice.
  #
  # This figure is for the workflow as measured. Activations scale with output
  # resolution and duration, so a longer or larger generation needs more.
  memoryGB: 100
  memoryMeasured: true
  # Replaces the image's CMD. --listen/--port are its own defaults, repeated
  # here because naming a command replaces them wholesale.
  #
  # --highvram was measured here and is deliberately NOT set. It does cut memory
  # sharply - about 60 GB against 104 GB, because it drops the staged host copy
  # ComfyUI keeps alongside the device copy so it can "offload to CPU", which
  # buys nothing when CPU and GPU are the same LPDDR5X. But it did not stop the
  # partial unloading it was meant to, and the run was slower than the default.
  # The memoryGB figure below is the default configuration's, so leaving the
  # flag off keeps the plan and the container in agreement.
  command:
    - --listen
    - 0.0.0.0
    - --port
    - "8188"
  readiness:
    # ComfyUI has no authentication of its own; the run probes this bare.
    path: /system_stats
    auth: none
  # Only the writable directories. The weights are not a directory mount: they
  # come out of the HuggingFace cache, file by file, from `weights` below.
  # Everything ComfyUI writes lives under one directory, a subfolder per kind.
  # Workflows especially: ComfyUI saves them inside the container by default, so
  # without this mount anything you save dies with the container - they are your
  # data, not container state.
  volumes:
    - host: ~/Workspace/comfyui/input
      container: /workspace/ComfyUI/input
    - host: ~/Workspace/comfyui/output
      container: /workspace/ComfyUI/output
    - host: ~/Workspace/comfyui/workflows
      container: /workspace/ComfyUI/user/default/workflows
  weights:
    # The int8 tier of the fl2va checkpoint set - the launcher's default. Sizes
    # measured from the files on the Spark, 2026-08-30. The repo holds every
    # quantisation tier, so this fetches four named files rather than the ~500 GB
    # whole. Each is bound read-only onto mountBase/<file>, which is the layout
    # ComfyUI loads from; the cache's own blob-and-symlink layout is not.
    - repo: Comfy-Org/MiniMax-H3
      sizeGB: 66.9
      measured: true
      mountBase: /workspace/ComfyUI/models
      files:
        - diffusion_models/minimax_h3_fl2va_int8_convrot.safetensors
        - text_encoders/qwen3vl_32b_minimax_h3_int8_convrot.safetensors
        - vae/minimax_h3_video_vae_fp16.safetensors
        - vae/minimax_h3_audio_vae_fp32.safetensors
  notes:
    - >-
      Licensed only outside the EU, UK, South Korea and the United States. Read
      the MiniMax H3 Community License before using its output for anything.
    - >-
      Opens ComfyUI's own web UI on the port below, not an API endpoint. It has
      no authentication, so treat the port as open to whoever can reach it.
    - >-
      Inputs, outputs and saved workflows live under ~/Workspace/comfyui on the
      node, one subfolder each. The run creates them if they are missing.
    - >-
      Its weights are ordinary HuggingFace cache entries, so the cache panel
      lists and can delete them. Deleting the repo there removes the files a
      running container is reading.

# ---------------------------------------------------------------------------
# NOT a port of a launcher script - this one is new, from
# https://github.com/QwenLM/Qwen3-ASR (Apache-2.0, weights included).
#
# A TRANSCRIPTION server rather than a chat one. Qwen3-ASR is a 24-layer audio
# encoder in front of a dense 1.7B Qwen3 decoder, and vLLM carries the
# architecture itself - vllm/model_executor/models/qwen3_asr.py, plus its own
# Qwen3ASRConfig and Qwen3ASRProcessor in transformers_utils - so nothing here
# needs --trust-remote-code and the repo's own `qwen-asr` package is not
# involved. The server answers /v1/audio/transcriptions and
# /v1/audio/translations as well as /v1/chat/completions, so an OpenAI
# transcription client points straight at it.
#
# THE STOCK IMAGE CANNOT DECODE AUDIO, which is why this is the only recipe
# here that builds an image instead of pulling one. vLLM keeps its audio
# dependencies in the `audio` extra - av, scipy, soundfile, soxr - and
# docker/Dockerfile installs the plain wheel, never that extra. The loaders in
# vllm/multimodal/media/audio.py degrade to PlaceholderModule rather than
# failing at import, so the stock image starts, serves /v1/models, PASSES THE
# READINESS PROBE, and then fails on the first audio file. Four wheels on top
# of the pinned image is the whole derivation; no part of vLLM is rebuilt, so
# this build is a minute or two rather than the hours a real aarch64 vLLM
# build would take.
#
# WEIGHTS. Read from the Hub's own file listing for revision 7278e1e7 on
# 2026-09-03, not off a node's cache - the cache stores these same blobs:
#
#   model-00001-of-00002.safetensors   4.220 GB
#   model-00002-of-00002.safetensors   0.478 GB
#
# So 4.7 GB, and `measured: true` because that is a reading of the actual
# files rather than something derived from the parameter count.
#
# KV CACHE. Derived from config.json, and unlike the two hybrids above it needs
# no correction factor. thinker_config.text_config is a plain dense Qwen3: 28
# layers, num_key_value_heads 8, head_dim 128, and the -hf export's layer_types
# lists all 28 of them as full_attention - no sliding window, no linear
# attention, nothing that keeps a fixed per-sequence state instead. So:
#
#   28 layers x 2 (K and V) x 8 kv heads x 128 head_dim x 2 bytes (bf16)
#     = 114,688 bytes per token
#
# The 1.37x block-padding correction the 27B recipe needs comes from
# --mamba-cache-mode align forcing an 880-token attention page; DiffusionGemma's
# 2.3x comes from its windowed layers' fixed state. Neither applies to a dense
# model on vLLM's ordinary 16-token blocks, where the pool divides out to the
# architectural rate and the only waste is a partial final block per sequence.
# Still worth replacing with the "GPU KV cache size" line off a real startup.
#
# HOW MUCH CONTEXT IS AN HOUR OF AUDIO. 13 tokens per second, exactly: the
# encoder's _get_feat_extract_output_lengths ends in (frames // 100) * 13, and
# a mel frame is 10 ms. So a 30-second clip is 390 tokens, and the full 65,536
# window is about 84 minutes of audio in a single prompt.
#
# That number matters less than it looks for the transcription endpoint.
# SpeechToTextConfig sets max_audio_clip_s from the feature extractor's
# chunk_length, which is 30, so /v1/audio/transcriptions SPLITS anything longer
# at the quietest point in a 100 ms window, with 1 second of overlap, and sends
# each chunk as its own request. Through that endpoint every request is ~400
# tokens whatever the recording's length, so a short context costs nothing and
# concurrency is the knob worth raising. The long window only comes into play
# when a whole recording goes in as one audio_url through /v1/chat/completions.
#
# THREE CAPS ON INPUT LENGTH, and the one that bites first is not the obvious
# one. vLLM enforces VLLM_MAX_AUDIO_CLIP_FILESIZE_MB (25) on the upload,
# VLLM_MAX_AUDIO_DECODE_DURATION_S (600) during decoding, and
# VLLM_MAX_AUDIO_DECODE_BYTES (256 MiB) on what decoding may allocate. At the
# defaults a 20-minute recording is refused for being 20 minutes long, not for
# being large. They are raised below.

- id: qwen3-asr-1-7b
  name: Qwen3-ASR-1.7B · BF16
  summary: >-
    Speech recognition for 30 languages and 22 Chinese dialects, on vLLM's
    OpenAI transcription endpoint. A dense 1.7B decoder behind an audio
    encoder, so the weights are small and the context is the whole cost.
  model:
    # Measured: the Hub's file listing at revision 7278e1e7, 2026-09-03.
    repo: Qwen/Qwen3-ASR-1.7B
    sizeGB: 4.7
    measured: true
  image:
    # Built on the node, not pulled - see the header. The tag is local and
    # names what it is; nothing publishes it.
    ref: vllm-openai-audio:v0.28.0-aarch64
    build:
      # The same pinned image the 27B recipe serves on, so the vLLM underneath
      # is the released v0.28.0 build and not a nightly.
      from: vllm/vllm-openai:v0.28.0-aarch64
      run:
        # vLLM's `audio` extra, minus mistral_common[audio], which only Voxtral
        # needs. uv is already in the image and this is how the image installs
        # its own packages. All four have aarch64 wheels, so nothing compiles.
        #
        # Deliberately unpinned, which means the tag is NOT reproducible: a
        # rebuild months from now picks up whatever those four resolve to.
        # Pin versions here if a run has to be repeatable.
        - uv pip install --system --no-cache av scipy soundfile soxr
  container: spark-run-qwen3-asr
  port: 8000
  # ESTIMATED, and the least certain figure here. Starting from the 27B's
  # measured breakdown - 2.73 non-torch + 3.07 activation + 1.81 CUDA graphs =
  # 7.61 GiB at 8192 batched tokens - and scaling only what depends on model
  # size: non-torch is a CUDA context and stays ~2.7; activation scales with
  # hidden size, 2048 here against the 27B's, so call it 1.5; graph capture
  # over 28 small layers, ~1. That is 5.2 GiB, rounded up to 6 GB.
  #
  # Rounded up deliberately: overstating it makes vLLM claim slightly more than
  # it needs, understating it leaves a pool too small for max-model-len and the
  # server exits during startup. Read it off the first startup log and replace.
  overheadGB: 6
  # Derived from config.json - 28 full-attention layers x 2 x 8 kv heads x 128
  # head_dim x 2 bytes. See the header for why no padding factor is applied.
  kvBytesPerToken: 114688
  kvMeasured: false
  env:
    # The three caps from the header, raised together - raising one alone does
    # nothing, since decoding stops at whichever is lowest. An hour of audio,
    # and 1 GiB covers an hour of mono 48 kHz float32 PCM with room over.
    #
    # These decode buffers are HOST allocations and live OUTSIDE vLLM's
    # fraction, so they eat the headroom the panel shows as free rather than
    # anything the plan reserves. VLLM_MAX_AUDIO_PREPROCESS_WORKERS defaults to
    # 2, so at most two are in flight and the exposure is bounded at ~2 GiB.
    VLLM_MAX_AUDIO_CLIP_FILESIZE_MB: 256
    VLLM_MAX_AUDIO_DECODE_DURATION_S: 3600
    VLLM_MAX_AUDIO_DECODE_BYTES: 1073741824
  args:
    --enable-prefix-caching: true
    --enable-chunked-prefill: true
    # config.json: text_config.max_position_embeddings 65536. The model's
    # native window, and a CEILING as well as the starting value - but see the
    # header: through /v1/audio/transcriptions almost nothing needs it, so
    # dropping the panel to 8192 costs nothing there and frees most of the KV
    # pool for concurrency.
    --max-model-len: 65536
    # A middle setting, not a measurement. Audio requests are short and this
    # model is small, so throughput here comes from streams rather than from
    # context; the panel offers up to 64 and that is the direction to go.
    --max-num-seqs: 8
    # The overhead figure above is scaled from a measurement taken at this
    # value. Peak activation is what tracks it, so changing it here without
    # re-reading a startup log makes that figure wrong.
    --max-num-batched-tokens: 8192
    # Written out rather than left implicit, so the KV rate above is tied to a
    # flag. auto means "the model's dtype", which is bfloat16 here.
    #
    # DO NOT write bfloat16: vLLM only accepts that value for models that
    # default to fp8 KV, and rejects it for everything else. fp8 is a legal
    # value and would halve the rate, but this export ships no KV scaling
    # factors, so it would need --calculate-kv-scales as well. Untested here,
    # and KV is not the binding constraint on a 4.7 GB model.
    --kv-cache-dtype: auto
  notes:
    - >-
      A transcription server. Point an OpenAI client at
      /v1/audio/transcriptions; /v1/audio/translations and
      /v1/chat/completions with an audio_url work too, and chat is the only way
      to send a whole recording as a single prompt.
    - >-
      This recipe BUILDS its image. The stock vllm/vllm-openai ships without
      vLLM's audio extra, and its audio loaders degrade to placeholders instead
      of failing at import - so the stock image would start, pass the readiness
      probe, and fail on the first audio file. The build adds four wheels.
    - >-
      Audio costs 13 tokens per second. A 30-second clip is 390 tokens, and the
      full 65,536 window is about 84 minutes of audio in one prompt.
    - >-
      /v1/audio/transcriptions splits anything over 30 seconds into overlapping
      chunks and transcribes each as its own request, so through that endpoint
      the context setting barely matters and concurrency is what to raise.
      Lowering the panel to 8192 there costs nothing.
    - >-
      Three caps limit input length, and at vLLM's defaults the one that bites
      is 10 minutes of decoded audio, not the 25 MB upload size. This recipe
      raises all three to an hour. The decode buffers are host allocations that
      sit outside vLLM's fraction, so they come out of the free headroom.
    - >-
      Weights are measured; the KV rate is derived from config.json and the
      overhead figure is an estimate scaled from another recipe's measurement.
      Read both off the first startup log and set kvMeasured true.
    - >-
      Qwen/Qwen3-ASR-0.6B is the same architecture at a third the weights, and
      also has a realtime variant for the /v1/realtime WebSocket - that one is
      not auto-detected and needs its architecture forced with --hf-overrides.

# ---------------------------------------------------------------------------
# GLM-ASR-Nano-2512. The second speech recogniser, and the first recipe that
# reuses another's image rather than building its own tag: the audio wheels it
# needs are exactly the four the Qwen3-ASR recipe adds, so it names the same
# `vllm-openai-audio:v0.28.0-aarch64` and the build is a docker layer-cache hit
# whichever of the two runs first. Keep the build steps below byte-identical to
# that recipe's or the cache misses and both tags get rebuilt in turn.
#
# WHAT THE UPSTREAM RECIPE SAYS TO DO, AND WHY MOST OF IT IS ALREADY DONE.
# recipes.vllm.ai/zai-org/GLM-ASR-Nano-2512 builds a venv, installs transformers
# from git and then `vllm[audio]` from PyPI. Against the pinned image none of
# that applies. vLLM v0.28.0's requirements/common.txt pins `transformers >=
# 5.5.3`, well past the 5.0.0 the model card asks for, so the image already
# understands GlmAsrProcessor and installing transformers from source would only
# swap a tested pin for a nightly. `GlmAsrForConditionalGeneration` is in
# v0.28.0's model registry, mapped to the `glmasr` module. What the stock image
# genuinely lacks is the same thing it lacked for Qwen3-ASR: the audio extra.
#
# BENCHMARKS, AND WHOSE THEY ARE. The model card leads with an average error
# rate of 4.10, and the upstream recipe repeats it as "SOTA". That figure is
# z.ai's own mix, weighted towards Chinese sets (Wenet Meeting, Aishell-1),
# which is where this model is genuinely strong. The neutral number is in the
# repo's own .eval_results: open-asr-leaderboard mean WER 7.03 at RTFx 145.28,
# recorded 2025-12-09 - LibriSpeech clean 2.15, AMI 16.15. Both are real; they
# measure different things, and only the second is comparable across models.
#
# KV CACHE. text_config in config.json: 28 layers, 4 kv heads, head_dim 128,
# dtype bfloat16.
#
#   28 layers x 2 (K and V) x 4 kv heads x 128 head_dim x 2 bytes
#     = 57,344 bytes per token
#
# Half Qwen3-ASR's rate, from half the kv heads, against a window an eighth the
# size. A full-length 8,192-token sequence is 0.47 GB of pool, so on a Spark the
# KV cache is not a constraint here at any concurrency the panel offers - which
# is why --max-num-seqs starts higher than the other ASR recipe's.
#
# HOW MUCH CONTEXT IS A SECOND OF AUDIO: 12.5 tokens, and unlike Qwen3-ASR the
# encoder is CHUNKED. vLLM cuts audio into 30-second windows
# (WhisperFeatureExtractor chunk_length 30) and runs the tower over the batch.
# Per window, from glmasr.py's conv params [(1,3,1), (1,3,2)] and merge_factor 4
# in glmasr_utils.py, over 3,000 mel frames at 100 frames per second:
#
#   conv1 (pad 1, kernel 3, stride 1):  (3000 + 2 - 3) // 1 + 1  = 3000
#   conv2 (pad 1, kernel 3, stride 2):  (3000 + 2 - 3) // 2 + 1  = 1500
#   merge 4:                            (1500 - 4)     // 4 + 1  =  375
#
# 375 tokens per 30-second window, so 12.5 per second. A partial window is not
# rounded up to a full one: the tower's output is trimmed by
# feature_attention_mask.sum(-1), so a 5-second tail costs 62 tokens, not 375.
#
# THE TRAP, AND THE ONE FLAG THAT DEFUSES IT. processor_config.json sets
# max_audio_len to 655, and vLLM reads that field as SECONDS in two places at
# once. It becomes SpeechToTextConfig.max_audio_clip_s, the length at which
# /v1/audio/transcriptions splits an upload, and it becomes max_windows =
# 655 // 30 = 21, the most 30-second windows one prompt may carry. Every other
# Whisper-shaped ASR model in vLLM chunks at the feature extractor's
# chunk_length, which is 30 here and 30 for Qwen3-ASR; GLM-ASR is the anomaly,
# because its handler prefers processor.max_audio_len when that field exists.
#
# 655 seconds is twenty-two times what this model can actually transcribe.
# MEASURED on a Spark, 2026-09-05, same clip in every row:
#
#   audio in    prompt tokens   transcript out    what came back
#     30 s          390            226 chars      the whole 30 seconds
#    300 s        3,765             38 chars      one sentence, then EOS
#    570 s          n/a         10,856 chars      one sentence looped 82x
#
# The model was trained on utterances that fit its 30-second window, so past
# roughly that length it stops after the first sentence or falls into a
# repetition loop. Nothing errors: every one of those was HTTP 200. The 570 s
# row is the default path - upload a ten-minute recording to
# /v1/audio/transcriptions and it returns 200 with a transcript that is 5.5%
# unique text and covers almost none of the recording.
#
# The context arithmetic is a red herring, and the first version of this recipe
# led with it. 630 seconds of audio is 7,875 tokens in an 8,192 window, which
# does leave only ~317 tokens for the transcript - but the model never gets far
# enough to need them. Fixing the chunk length fixes both at once.
#
# --mm-processor-kwargs '{"max_audio_len": 30}' moves both numbers together,
# because both read the same processor attribute. 30 makes this model behave
# like every other Whisper-shaped recogniser vLLM serves: the endpoint splits a
# long upload at the quietest point near each 30-second boundary, sends each
# piece as its own 375-token request, and stitches the results. It also shrinks
# the dummy audio vLLM profiles with.
#
# MEASURED on a Spark, 2026-09-05, and worth repeating because the startup log
# actively argues against it. transformers prints
#
#   [transformers] Keyword argument `max_audio_len` is not a valid argument
#   for this processor and will be ignored.
#
# and that warning is WRONG in the way that matters: max_audio_len is not in
# GlmAsrProcessor.__init__'s signature, so transformers complains, but the value
# still lands on the processor and vLLM reads it off the object. A 402.8-second
# recording sent to /v1/chat/completions came back with 3,757 prompt tokens -
# 10 windows x 375, plus 7 for the prompt. Left at 655 the same file would have
# been 14 windows and 5,257. Do not "fix" this flag because of the warning; test
# it with a file longer than 300 seconds and read prompt_tokens instead.
#
# This lowers the longest single chat prompt from 630 seconds to 30, which is
# the honest ceiling: the measurements above are what the longer prompts were
# actually worth. Raising it buys nothing until a model ships that can hold a
# transcript longer than its training window.
#
# The three decode caps are the same ones the Qwen3-ASR recipe raises, and they
# still bite here: an upload is decoded WHOLE before it is split into 300-second
# chunks, so a forty-minute recording meets the 600-second decode cap long
# before the splitter ever sees it.

- id: glm-asr-nano-2512
  name: GLM-ASR-Nano-2512 · BF16
  summary: >-
    Mandarin, Cantonese and English speech recognition, strongest of the two
    ASR recipes on Chinese and on quiet speech. 2.3B total, 1.5B active, behind
    a chunked Whisper-style encoder - small weights and a short 8K window.
  model:
    # Measured: the Hub's file listing at revision 61ba4e0b, read 2026-09-05.
    # 4,522,623,926 bytes, almost all of it the single model.safetensors.
    repo: zai-org/GLM-ASR-Nano-2512
    sizeGB: 4.5
    measured: true
  image:
    # Shared with qwen3-asr-1-7b on purpose - same tag, same Dockerfile, so
    # whichever recipe runs second builds nothing. See the header.
    ref: vllm-openai-audio:v0.28.0-aarch64
    build:
      from: vllm/vllm-openai:v0.28.0-aarch64
      run:
        # Byte-identical to the Qwen3-ASR recipe's step. Do not "improve" one
        # without the other; the layer cache is the whole point.
        - uv pip install --system --no-cache av scipy soundfile soxr
  container: spark-run-glm-asr-nano
  port: 8000
  # MEASURED, off a real startup on a Spark on 2026-09-05 at --max-num-seqs 8
  # and --max-num-batched-tokens 8192. vLLM logged 6.21 GiB for weights plus
  # non-torch against 4.21 GiB of weight files, so:
  #
  #   2.00 GiB  non-torch (the CUDA context)
  #   0.80 GiB  peak activation
  #   0.50 GiB  CUDAGraph memory
  #   3.30 GiB  = 3.6 GB
  #
  # The first estimate here was 6 GB, scaled from the Qwen3-ASR recipe. It was
  # 1.7x too high, mostly in the CUDA context: the batched audio tower turned
  # out to cost far less than the guess allowed for. Erring high cost nothing -
  # a pool too small for max-model-len makes the server exit during startup.
  overheadGB: 3.6
  # MEASURED, and exactly the architectural figure: 28 text layers x 2 x 4 kv
  # heads x 128 head_dim x 2 bytes. vLLM logged a 119,360-token pool in 6.38
  # GiB, and 119,360 x 57,344 is 6.375 GiB, which is what 6.38 rounds from.
  # Dense attention on ordinary 16-token blocks, so no padding correction
  # applies - the only waste is a partial final block per sequence.
  kvBytesPerToken: 57344
  kvMeasured: true
  env:
    # Raised together, because decoding stops at whichever is lowest. These are
    # HOST allocations outside vLLM's fraction, so they come out of the free
    # headroom the panel shows rather than anything the plan reserves.
    VLLM_MAX_AUDIO_CLIP_FILESIZE_MB: 256
    VLLM_MAX_AUDIO_DECODE_DURATION_S: 3600
    VLLM_MAX_AUDIO_DECODE_BYTES: 1073741824
  args:
    # Each request carries its own audio, so the only shared prefix is the
    # ~20-token generation prompt. Costs nothing, buys almost nothing here.
    --enable-prefix-caching: true
    --enable-chunked-prefill: true
    # config.json: text_config.max_position_embeddings 8192. The model's native
    # window and the panel's ceiling. Short by modern standards, and the reason
    # max_audio_len has to come down - see the header.
    --max-model-len: 8192
    # Higher than the Qwen3-ASR recipe's 8 because a full-length sequence here
    # is 0.47 GB of KV against its 7.5 GB. Audio requests are short and this
    # model is small, so streams are where throughput comes from; the panel
    # offers up to 64 and that is the direction to go.
    --max-num-seqs: 16
    # One full-length request per batch. The overhead figure above is scaled
    # from a measurement at this value, and peak activation is what tracks it.
    --max-num-batched-tokens: 8192
    # auto means "the model's dtype", which is bfloat16 here. DO NOT write
    # bfloat16: vLLM only accepts that value for models that default to fp8 KV.
    # fp8 would halve the rate but needs --calculate-kv-scales, since this
    # export ships no scaling factors - and KV is not the constraint here.
    --kv-cache-dtype: auto
    # The header explains this one at length, with the measurements. It is the
    # difference between a transcript of the recording and one sentence of it.
    --mm-processor-kwargs: '{"max_audio_len": 30}'
  notes:
    - >-
      A transcription server. Point an OpenAI client at
      /v1/audio/transcriptions; /v1/audio/translations and
      /v1/chat/completions with input_audio work too, and chat is the only way
      to send a whole recording as a single prompt.
    - >-
      Strongest of the two ASR recipes on Mandarin, Cantonese and other Chinese
      dialects, and trained specifically for quiet and whispered speech. On the
      neutral open-asr-leaderboard it scores 7.03 mean WER at RTFx 145.28; the
      4.10 the model card advertises is z.ai's own Chinese-weighted mix.
    - >-
      Audio costs 12.5 tokens per second, in 30-second windows of 375 tokens
      each, so one chunk is a ~390-token request and the 8,192 window is never
      the binding constraint through the transcription endpoint.
    - >-
      This recipe caps audio at 30 seconds with --mm-processor-kwargs, which is
      the model's training window and what every other Whisper-shaped model in
      vLLM uses. At vLLM's default of 655 a ten-minute upload returns HTTP 200
      with one sentence looped 82 times; at 30 the same recording transcribes
      in full. Long recordings still go in whole - the endpoint splits them and
      stitches the pieces back together.
    - >-
      It shares its built image with the Qwen3-ASR recipe, so only the first of
      the two to run pays for the build. The stock vllm/vllm-openai ships
      without vLLM's audio extra and its loaders degrade to placeholders rather
      than failing at import, so it would start, pass the readiness probe, and
      fail on the first audio file.
    - >-
      Three decode caps limit input length, and at vLLM's defaults the one that
      bites is 10 minutes of decoded audio, not the 25 MB upload size. An
      upload is decoded whole before it is split, so this matters for long
      recordings even though each chunk is 5 minutes. All three are raised.
    - >-
      Every figure here is measured on a Spark: weights from the Hub listing,
      and the KV rate and overhead off a real vLLM 0.28.0 startup on
      2026-09-05. It served an 11-second clip in 1.1 seconds.
    - >-
      The startup log says max_audio_len "is not a valid argument for this
      processor and will be ignored". It is not ignored - transformers only
      means it is not a named __init__ argument. Check it by sending a clip
      longer than the cap and reading prompt_tokens: it stops rising at 390.
    - >-
      The audio encoder gets its own cache budget, equal to
      --max-num-batched-tokens. At 8,192 and 30-second chunks that is 21 clips
      encoding at once, comfortably more than --max-num-seqs, so concurrency is
      free to rise.
    - >-
      vLLM sends its own transcription prompt, not the "Please transcribe this
      audio into text" the processor ships as default_transcription_prompt. It
      works at 30-second chunks. Use /v1/chat/completions with the model's own
      prompt if you ever need to match the model card exactly.
    - >-
      Unlike the pinned vLLM the upstream recipe assumes, no transformers
      install is needed: v0.28.0 already pins transformers >= 5.5.3 and knows
      GlmAsrForConditionalGeneration.
